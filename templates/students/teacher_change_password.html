{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto;">
  <div class="card-body">
    <h4>Change Password — {{ teacher.get_full_name }}</h4>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100 mt-2">Update Password</button>
      <a href="{% url 'students:teacher_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
